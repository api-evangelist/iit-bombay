identifier_convention: >-
  Every object carries both a UUID `id` and a human-readable `str_id` slug
  (e.g. "lecture-2-pgac-postdoctoral-opportunities-series-562b08f2"). Both are accepted on
  retrieval paths. Consistent across the surface.
