note: >-
  Reward-only. A standard appears below only where a live probe or the institution's own
  published contract carries the evidence quoted against it. Where a target could not be
  reached, conforms is `unverified` and the blocking status code is recorded — that is a
  statement about OUR probe, not a finding that the institution lacks the capability. Nine of
  the twelve education-regime standards produced no evidence at all in IIT Bombay's public
  footprint and are recorded as such rather than omitted, so the absence is legible.
standards:

- id: oai-pmh
  conforms: unverified
  x-operator: institution
  evidence: >-
    The IIT Bombay Central Library institutional repository at dspace.library.iitb.ac.in runs
    DSpace and the OAI-PMH interface is the endpoint this repo has recorded since 2026-06-03 at
    https://dspace.library.iitb.ac.in/oai/request. On 2026-08-30 that URL returned 403 Forbidden
    from Apache with a broken ErrorDocument ("Additionally, a 500 Internal Server Error error was
    encountered while trying to use an ErrorDocument to handle the request"), with a browser
    User-Agent, an XML Accept header and a same-host Referer. /jspui/ returns 403 the same way,
    while /jspui/oai/request renders a genuine DSpace "Document Not Found" page — so the DSpace
    application is alive and it is the /oai path that is denied at the web-server layer.
    /xmlui/OAI/request?verb=Identify returns HTTP 200 with Content-Length: 0, a soft-200 that is
    dead, not a response. No verb (Identify, ListMetadataFormats, ListSets) produced a valid
    OAI-PMH envelope from any path.
  probes:
  - { url: 'https://dspace.library.iitb.ac.in/oai/request?verb=Identify', status: 403 }
  - { url: 'https://dspace.library.iitb.ac.in/jspui/', status: 403 }
  - { url: 'https://dspace.library.iitb.ac.in/jspui/oai/request?verb=Identify', status: 404, detail: DSpace application error page — app is live }
  - { url: 'https://dspace.library.iitb.ac.in/xmlui/OAI/request?verb=Identify', status: 200, detail: 'Content-Length: 0 — soft-200, no OAI envelope' }
  - { url: 'https://dspace.library.iitb.ac.in/', status: 200, detail: meta-refresh to /jspui/ }
  correction: >-
    The previous profile asserted "The Identify verb returns a valid OAI-PMH 2.0 response,
    confirming a live harvesting endpoint". That assertion is no longer reproducible and has been
    withdrawn from apis.yml. It is downgraded to unverified rather than to false, because a
    server-side 403 on the harvesting path is consistent with a repository that harvests fine for
    allow-listed aggregators.

