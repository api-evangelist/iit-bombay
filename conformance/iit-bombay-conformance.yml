- id: oidc-discovery
  conforms: true
  x-operator: institution
  evidence: >-
    https://sso.iitb.ac.in/.well-known/openid-configuration returns 200 with a valid OpenID
    Connect Discovery 1.0 document — issuer https://sso.iitb.ac.in, authorization, token,
    userinfo and jwks endpoints, scopes_supported ["openid"], response_types_supported ["code"],
    token_endpoint_auth_methods_supported ["client_secret_basic"]. The JWKS at
    https://sso.iitb.ac.in/.well-known/jwks.json returns 200 with one RSA key (kid "sso"). The
    token endpoint answers 400 "method must be POST" and userinfo answers 401 unauthenticated,
    both confirming live services rather than static files.
  probes:
  - { url: 'https://sso.iitb.ac.in/.well-known/openid-configuration', status: 200 }
  - { url: 'https://sso.iitb.ac.in/.well-known/jwks.json', status: 200 }
  - { url: 'https://sso.iitb.ac.in/token', status: 400 }
  - { url: 'https://sso.iitb.ac.in/user', status: 401 }

