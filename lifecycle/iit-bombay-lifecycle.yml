versioning:
  scheme: none-in-uri
  declared_version: v1
  detail: >-
    info.version is "v1" but the base path carries no version segment — the base is
    https://gymkhana.iitb.ac.in/instiapp/api, not /api/v1. One path group does version itself
    in-band: /buy/products and /buy/v2/products coexist, so the marketplace resource has an
    unannounced v2 alongside its v1 while the document still calls the whole API v1.
  spec_generation: >-
    The specification is autogenerated by drf-yasg from the Django REST Framework routes at
    request time, so it tracks the deployed code exactly and has no release cadence of its own.
    That is a real strength for freshness and a real weakness for stability: there is no pinned
    artifact a consumer can diff against.
