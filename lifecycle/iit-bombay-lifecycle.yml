stability_assessment: >-
  Actively maintained but informally governed. The contract is regenerated from live code, the
  code is public and current, and the maintainer address is institutional. Against that: no
  versioned base path, no declared error responses, no deprecation signal, no changelog, and an
  unannounced v2 already in flight on one resource. A consumer should track the repository, not
  the specification.
