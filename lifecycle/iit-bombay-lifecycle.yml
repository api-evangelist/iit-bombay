    pair is the one place where an older shape is visibly being superseded, and it is not marked.
change_communication:
  changelog_url: null
  detail: >-
    There is no changelog, release-notes page or status page for any IIT Bombay API surface. The
    substitute — and it is a genuine one — is the public source repository. The API's own code is
    published at https://github.com/DevCom-IITB/instiapp-api under AGPL-3.0 (26 stars, last push
