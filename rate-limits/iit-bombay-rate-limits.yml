description: 'IIT Bombay publishes no rate-limit table for any of its API surfaces. This entry is now
  measured rather than assumed: on 2026-08-30 eight unauthenticated GETs against the InstiApp API at https://gymkhana.iitb.ac.in/instiapp/api
  (events, bodies, news, mess, locations, buy/products, venter/complaints, venter/tags) all returned 200
  with no rate-limit headers of any kind — no X-RateLimit-*, no RateLimit-*, no Retry-After. No 429 was
  observed. The one throttling-adjacent behaviour actually found on an institution host is not a rate
  limit at all but a blanket 403 on the Central Library DSpace /oai path, which denies OAI-PMH harvesting
  outright rather than pacing it.'
notes: The previous version of this file asserted that OAI-PMH, IIIF and library endpoints may throttle
  harvesting. No IIIF surface exists on any IIT Bombay host and none was ever probed; that claim is withdrawn.
  Harvest politely regardless — absence of a published limit is not permission for volume.
