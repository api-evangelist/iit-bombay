x-coverage:
  state: covered
  reason: covered
  detail: >-
    IIT Bombay is one of the few universities in this cohort with a genuine first-party API, and
    this run found it. The InstiApp API is institution-hosted (gymkhana.iitb.ac.in), publishes an
    autogenerated 112-path specification at /docs/, answers a substantial read surface with no
    credential, and carries an institutional contact and AGPL-3.0 public source — captured here as
    an OpenAPI plus derived schema, vocabulary, ruleset, lifecycle and probed examples and errors.
    A second institution-operated surface, the Computer Centre's central OpenID Connect provider
    at sso.iitb.ac.in, publishes a live discovery document and JWKS and was not previously
    catalogued. What IIT Bombay does NOT publish is equally settled and stated rather than padded:
    no central developer portal, no course-catalog or registrar API (asc.iitb.ac.in is a
    single-sign-on gate behind hCaptcha), no open-data portal (data.iitb.ac.in does not resolve),
    no research-computing or HPC surface (hpc./spacetime. do not resolve), no library discovery API
    (opac.library.iitb.ac.in returns 502), no AI policy or AI-tooling statement discoverable from
    the institutional site, and nine of the twelve education-regime domain standards produce no
    evidence at all. One surface is genuinely blocked to us rather than absent: the Central Library
    DSpace OAI-PMH endpoint is denied at the Apache layer (403) while the DSpace application itself
    is demonstrably alive, so oai-pmh conformance is recorded as unverified, not false. No vendor
    contract was added and none was found attributed to this institution — the pre-run audit
    reported no hostless, shared-contract or misbased findings, and none were discovered by hand.
