        - { url: 'https://dspace.library.iitb.ac.in/oai/request?verb=Identify', status: 403 }
        - { url: 'https://dspace.library.iitb.ac.in/jspui/', status: 403 }
        - { url: 'https://dspace.library.iitb.ac.in/jspui/oai/request?verb=Identify', status: 404, note: DSpace application error page }
        - { url: 'https://dspace.library.iitb.ac.in/xmlui/OAI/request?verb=Identify', status: 200, note: 'Content-Length 0 — soft-200' }
    properties:
