aid: iit-bombay
name: Indian Institute of Technology Bombay
x-type: university
x-category: Institute of Technology
description: >-
  The Indian Institute of Technology Bombay (IIT Bombay), founded in 1958 at Powai, Mumbai, is one
  of India's premier engineering and research institutions and one of the very few universities in
  this catalog that actually publishes a first-party, machine-readable API contract of its own. It
  operates no central developer portal and no institutional API programme, and there is no course
  catalog, registrar, open-data or research-computing API in public view. What it does run — and
  what almost every peer institution does not — is a live OpenAPI-described campus-life API,
  InstiApp, served from its own host at gymkhana.iitb.ac.in with an autogenerated 112-path
  specification, an institutional contact address and AGPL-3.0 source published by the Developers'
  Community. Alongside it sit two institution-operated identity surfaces: the Computer Centre's
  central OpenID Connect provider at sso.iitb.ac.in, which publishes a live discovery document and
  JWKS, and the Students' Gymkhana OAuth 2.0 Profiles service with ten documented consent scopes,
  access to which is restricted to applications hosted on Gymkhana infrastructure. The Central
  Library runs a DSpace institutional repository whose OAI-PMH endpoint is currently denied at the
  web-server layer. A fourth surface, the Institute Technical Council's SSO, is run by an IIT
  Bombay student body but on a domain the institution does not own, and is recorded as a tenant
  relationship rather than credited to the institution.
