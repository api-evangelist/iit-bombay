    name: DSpace Institutional Repository (Central Library)
    x-operator: institution
    x-operator-evidence: >-
      Host dspace.library.iitb.ac.in is under the institution's own registrable domain and
      resolves to 103.21.126.134, the same address as www.library.iitb.ac.in. DSpace is vendor
      software, but the deployment, the host and the content are the institution's — the
      university pipeline's rule for OAI-PMH on an institution's own host.
    description: >-
      The IIT Bombay Central Library institutional repository, running DSpace over theses, journal
      articles and conference papers. Its OAI-PMH 2.0 harvesting interface is the surface of
      interest and it is NOT currently verifiable: https://dspace.library.iitb.ac.in/oai/request
      returns 403 Forbidden from Apache with a browser User-Agent, an XML Accept header and a
      same-host Referer, and its ErrorDocument 500s behind that. /jspui/ is 403 the same way,
      while /jspui/oai/request renders a genuine DSpace error page, so the application is alive
      and it is the /oai path that is denied at the web-server layer. /xmlui/OAI/request returns
      HTTP 200 with Content-Length 0 — a soft-200, not a response. The claim in this repo's June
      2026 profile that the Identify verb returned a valid OAI-PMH 2.0 envelope has been withdrawn.
    humanURL: https://dspace.library.iitb.ac.in/
    baseURL: https://dspace.library.iitb.ac.in/oai/request
    tags: [ Research Repository, OAI-PMH, Open Access, Library, Research, Metadata ]
