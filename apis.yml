  - aid: iit-bombay:sso-oidc
    name: IITB Central SSO — OpenID Connect
    x-operator: institution
    x-operator-evidence: >-
      Host sso.iitb.ac.in is under the institution's own registrable domain. The discovery
      document's issuer is https://sso.iitb.ac.in itself. The sign-in page is branded "Computer
      Center, IIT Bombay". No vendor identity platform is involved.
    description: >-
      The IIT Bombay Computer Centre's central identity provider, and the credential every
      institutional service sits behind. It publishes a live OpenID Connect Discovery 1.0
      document and a JWKS: issuer https://sso.iitb.ac.in, authorization, token and userinfo
      endpoints, response_types_supported ["code"], token_endpoint_auth_methods_supported
      ["client_secret_basic"], and a deliberately minimal scopes_supported of ["openid"].
      Interactive sign-in is LDAP plus a second factor — TOTP, a hardware credential, or SMS OTP.
      Client registration is not self-service; the Gymkhana developer documentation directs
      external developers to the Computer Centre for IITB SSO integration.
    humanURL: https://sso.iitb.ac.in/
    baseURL: https://sso.iitb.ac.in
    tags: [ Identity, Single Sign-On, OpenID Connect, Authentication, Federation ]
    properties:
