apis:

  - aid: iit-bombay:instiapp-api
    name: InstiApp API
    x-operator: institution
    x-operator-evidence: >-
      servers[0].url is https://gymkhana.iitb.ac.in/instiapp/api — a host under the institution's
      own registrable domain iitb.ac.in. info.contact.email is devcom@iitb.ac.in. The
      implementation is published by the institution's Developers' Community at
      github.com/DevCom-IITB/instiapp-api under AGPL-3.0. The vanity host api.insti.app 301-
      redirects to gymkhana.iitb.ac.in/instiapp/, so even the non-institutional-looking domain
      resolves to institution infrastructure. No vendor appears anywhere in the contract.
    description: >-
      IIT Bombay's campus-life API and the single largest first-party programmable surface the
      institution operates. 112 paths and 164 operations over student bodies and their role
      graphs (154 bodies live), institute events and calendar, the news feed, hostel mess menus
      (22 messes), 427 named campus map locations with institute-map coordinates, a public
      grievance register, a student marketplace, lost-and-found, achievements, and
      placement/internship blogs. A substantial read surface answers with no credential at all;
      user-scoped and placement paths require a session. The specification is autogenerated by
      drf-yasg from the live Django routes and is served at /docs/.
