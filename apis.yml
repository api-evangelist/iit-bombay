- aid: iit-bombay:itc-sso
  name: ITC Single Sign-On
  x-operator: tenant
  x-operator-evidence: >-
    Operated by the Institute Technical Council, an IIT Bombay student body, but NOT on an institution-owned
    host. tech-iitb.org was registered 2024-10-02 through Hostinger and resolves to 82.112.236.232 (Hostinger).
    The institution's registrable domain is iitb.ac.in. Under the operator axis this is a student-body
    surface on a domain the institution does not control — a real relationship, recorded as such, and
    not credited to the institution's own engineering.
  description: >-
    A session-based Single Sign-On service maintained by the Institute Technical Council for authenticating
    IIT Bombay users in student and club projects. A redirect-based ssocall flow returns an access id
    that the backend exchanges via a getuserdata POST for user profile fields (name, roll number, department,
    degree, graduation year). Sessions last one hour. No OpenID Connect discovery document is published;
    /.well-known/openid-configuration returns 404.
  humanURL: https://sso.tech-iitb.org/docs/
  baseURL: https://sso.tech-iitb.org/
